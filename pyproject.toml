version = "0.1.0"
description = "AI-native, MCP-enabled regional stock data service powered by Yahoo Finance"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["yahoo-finance", "mcp", "stocks", "scraper", "ai"]
dependencies = [
    "anthropic>=0.40.0",
    "bs4>=0.0.2",
    "duckdb>=1.1.0",
    "mcp[cli]>=1.0.0",
    "openai>=1.0.0",
    "pytest>=9.0.2",
    "python-dotenv>=1.2.1",
    "requests>=2.32.0",
]
