[project]
name = "equity-screener-mcp-server"
version = "0.1.0"
description = "AI-native, MCP-enabled regional equity screener with DuckDB persistence"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["equity-screener", "mcp", "stocks", "finance", "ai"]
dependencies = [
    "anthropic>=0.40.0",
    "bs4>=0.0.2",
    "duckdb>=1.1.0",
    "mcp[cli]>=1.0.0",
    "openai>=1.0.0",
    "pytest>=9.0.2",
    "python-dotenv>=1.2.1",
    "requests>=2.32.0",
    "ruff>=0.4.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
